---
# Project source code URL: https://github.com/homepage-labs/homepage

homepage_enabled: true

homepage_identifier: homepage
homepage_base_path: "/{{ homepage_identifier }}"
homepage_data_path: "{{ homepage_base_path }}/data"

# renovate: datasource=docker depName=ghcr.io/homepage-labs/homepage
homepage_version: v1.74.0

homepage_uid: ""
homepage_gid: ""

homepage_docker_endpoint: unix:///var/run/docker.sock
homepage_docker_endpoint_is_unix_socket: "{{ homepage_docker_endpoint.startswith('unix://') }}"
homepage_environment_variables_allowed_hosts: "{{ homepage_hostname }}"
homepage_environment_variables_additional_variables: ""

# The scheme used for serving homepage.
homepage_scheme: https

# The hostname at which homepage is served.
homepage_hostname: ""

# The path at which homepage is served.
# This value must either be `/` or not end with a slash (e.g. `/homepage`).
#
# Hosting homepage under a subpath does not seem to be possible due to homepage's
# technical limitations.
homepage_path_prefix: /

homepage_container_image: "{{ homepage_container_image_registry_prefix }}homepage-labs/homepage:{{ homepage_container_image_tag }}"
homepage_container_image_tag: "{{ homepage_version }}"
homepage_container_image_registry_prefix: "{{ homepage_container_image_registry_prefix_upstream }}"
homepage_container_image_registry_prefix_upstream: "{{ homepage_container_image_registry_prefix_upstream_default }}"
homepage_container_image_registry_prefix_upstream_default: ghcr.io/

homepage_container_image_self_build: false
homepage_container_image_self_build_name: "homepage-labs/homepage:{{ homepage_container_image_self_build_repo_version }}"
homepage_container_image_self_build_repo: "https://github.com/homepage-labs/homepage.git"
homepage_container_image_self_build_repo_version: "{{ homepage_version if homepage_version != 'latest' else 'main' }}"
homepage_container_image_self_build_src_files_path: "{{ homepage_base_path }}/docker-src"

# The base container network. It will be auto-created by this role if it doesn't exist already.
homepage_container_network: "{{ homepage_identifier }}"

# Control if the container network is deleted on uninstalling.
homepage_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `homepage_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
homepage_container_http_host_bind_port: ""

# The port number in the container
homepage_container_http_port: 7575

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
homepage_container_additional_networks: "{{ homepage_container_additional_networks_auto + homepage_container_additional_networks_custom }}"
homepage_container_additional_networks_auto: []
homepage_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
homepage_container_additional_volumes: "{{ homepage_container_additional_volumes_auto + homepage_container_additional_volumes_custom }}"
homepage_container_additional_volumes_auto: []
homepage_container_additional_volumes_custom: []

# homepage_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `homepage_container_labels_additional_labels_custom`.
homepage_container_labels_traefik_enabled: true
homepage_container_labels_traefik_docker_network: "{{ homepage_container_network }}"
homepage_container_labels_traefik_hostname: "{{ homepage_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/homepage`).
homepage_container_labels_traefik_path_prefix: "{{ homepage_path_prefix }}"
homepage_container_labels_traefik_rule: "Host(`{{ homepage_container_labels_traefik_hostname }}`){% if homepage_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ homepage_container_labels_traefik_path_prefix }}`){% endif %}"
homepage_container_labels_traefik_priority: 0
homepage_container_labels_traefik_entrypoints: web-secure
homepage_container_labels_traefik_tls: "{{ homepage_container_labels_traefik_entrypoints != 'web' }}"
homepage_container_labels_traefik_tls_certResolver: default  # noqa var-naming
homepage_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
homepage_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `homepage_container_labels_traefik_additional_request_headers_custom`
homepage_container_labels_traefik_additional_request_headers: "{{ homepage_container_labels_traefik_additional_request_headers_auto | combine(homepage_container_labels_traefik_additional_request_headers_custom) }}"
homepage_container_labels_traefik_additional_request_headers_auto: {}
homepage_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `homepage_container_labels_traefik_additional_response_headers_custom`
homepage_container_labels_traefik_additional_response_headers: "{{ homepage_container_labels_traefik_additional_response_headers_auto | combine(homepage_container_labels_traefik_additional_response_headers_custom) }}"
homepage_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': homepage_http_header_xss_protection} if homepage_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': homepage_http_header_content_type_options} if homepage_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': homepage_http_header_content_security_policy} if homepage_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': homepage_http_header_permissions_policy} if homepage_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': homepage_http_header_strict_transport_security} if homepage_http_header_strict_transport_security and homepage_container_labels_traefik_tls else {})
  }}
homepage_container_labels_traefik_additional_response_headers_custom: {}

# homepage_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `homepage_container_labels_additional_labels_custom`
#
# Example:
# homepage_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
homepage_container_labels_additional_labels: "{{ homepage_container_labels_additional_labels_auto + homepage_container_labels_additional_labels_custom }}"
homepage_container_labels_additional_labels_auto: []
homepage_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
homepage_container_extra_arguments: "{{ homepage_container_extra_arguments_auto + homepage_container_extra_arguments_custom }}"
homepage_container_extra_arguments_auto: []
homepage_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
homepage_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
homepage_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
homepage_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
homepage_http_header_permissions_policy: "{{ 'interest-cohort=()' if homepage_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
homepage_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if homepage_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `homepage_http_header_permissions_policy`
homepage_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `homepage_http_header_strict_transport_security`
homepage_hsts_preload_enabled: false

# List of systemd services that the homepage systemd service depends on
homepage_systemd_required_services_list: "{{ homepage_systemd_required_services_list_default + homepage_systemd_required_services_list_auto + homepage_systemd_required_services_list_custom }}"
homepage_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
homepage_systemd_required_services_list_auto: []
homepage_systemd_required_services_list_custom: []

# List of systemd services that the homepage systemd service wants
homepage_systemd_wanted_services_list: "{{ homepage_systemd_wanted_services_list_default + homepage_systemd_wanted_services_list_auto + homepage_systemd_wanted_services_list_custom }}"
homepage_systemd_wanted_services_list_default: []
homepage_systemd_wanted_services_list_auto: []
homepage_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
homepage_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
homepage_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
homepage_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
homepage_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ homepage_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ homepage_container_stop_grace_time_seconds }} {{ homepage_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ homepage_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ homepage_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ homepage_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ homepage_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ homepage_identifier }} after {{ homepage_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1
