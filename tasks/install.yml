---
- name: Ensure homepage paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_gid }}"
  with_items:
    - "{{ homepage_base_path }}"
    - "{{ homepage_data_path }}"

- name: Ensure homepage support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ homepage_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_gid }}"
  with_items:
    - env
    - labels
  register: homepage_support_files_result

- name: Run if self-building of homepage container image is not enabled
  when: "not homepage_container_image_self_build | bool"
  block:
    - name: Ensure homepage container image is pulled via community.docker.docker_image_pull
      when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
      community.docker.docker_image_pull:
        name: "{{ homepage_container_image }}"
        pull: always
      register: homepage_container_image_pull_result_ansible_module
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: homepage_container_image_pull_result_ansible_module is not failed

    - name: Ensure homepage container image is pulled via ansible.builtin.command
      when: devture_systemd_docker_base_container_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ homepage_container_image }}"
      register: homepage_container_image_pull_result_command
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: homepage_container_image_pull_result_command is not failed
      changed_when: "'Downloaded newer image' in homepage_container_image_pull_result_command.stdout"

- name: Run if self-building of homepage container image is enabled
  when: "homepage_container_image_self_build | bool"
  block:
    - name: Ensure homepage repository is present on self-build
      ansible.builtin.git:
        repo: "{{ homepage_container_image_self_build_repo }}"
        version: "{{ homepage_container_image_self_build_repo_version }}"
        dest: "{{ homepage_container_image_self_build_src_files_path }}"
        force: "yes"
      register: homepage_git_pull_results

    - name: Ensure homepage container image is built
      community.docker.docker_image_build:
        name: "{{ homepage_container_image_self_build_name }}"
        dockerfile: Dockerfile
        path: "{{ homepage_container_image_self_build_src_files_path }}"
        pull: true
        rebuild: "{{ 'always' if homepage_git_pull_results.changed | bool else 'never' }}"
      register: homepage_container_image_build_result

- name: Ensure homepage container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ homepage_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: homepage_network_creation_result

- name: Ensure homepage container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ homepage_container_network }}
  register: homepage_network_creation_result
  changed_when: homepage_network_creation_result.rc == 0
  failed_when: homepage_network_creation_result.rc != 0 and 'already exists' not in homepage_network_creation_result.stderr

- name: Ensure homepage systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/homepage.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ homepage_identifier }}.service"
    mode: "0644"
  register: homepage_systemd_service_result

- name: Determine whether homepage needs a restart
  ansible.builtin.set_fact:
    homepage_restart_necessary: >-
      {{
        homepage_support_files_result.changed | default(false)
        or homepage_systemd_service_result.changed | default(false)
        or homepage_container_image_pull_result_ansible_module.changed | default(false)
        or homepage_container_image_pull_result_command.changed | default(false)
        or homepage_container_image_build_result.changed | default(false)
      }}
